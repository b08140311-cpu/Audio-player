name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log
      - name: Report compile errors
        if: failure()
        run: grep -E '^e: |error:' build.log | head -30 | while read -r line; do echo "::error::${line}"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: audio-player-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish direct APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${GITHUB_RUN_NUMBER}" app/build/outputs/apk/debug/*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Audio Player APK ${GITHUB_RUN_NUMBER}" \
            --notes "Installable Android debug APKs. Choose the APK matching your phone architecture."

